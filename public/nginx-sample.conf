# Nginx Configuration snippet for Eksper Technologies SPA
# Place this inside your server { ... } block:

server {
    listen 80;
    server_name yourdomain.com; # Replace with your domain

    root /var/www/ekspertech;   # Path to your extracted dist/ folder
    index index.html;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets with hash fingerprints
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing fallback: send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
